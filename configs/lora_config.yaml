# LoRA Configuration for ATS Phi Fine-Tuning
# =============================================

# LoRA hyperparameters
r: 16
lora_alpha: 32
lora_dropout: 0.05

# Target modules for Phi architecture
target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj

# Bias configuration
bias: "none"

# Task type
task_type: "CAUSAL_LM"

# Inference mode (set to false for training)
inference_mode: false
